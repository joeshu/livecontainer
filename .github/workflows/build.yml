name: Xcode - Build

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
      SIDESTORE_REPOSITORY: joeshu/SideStore
      SIDESTORE_COMMIT: 56db351b0eaa7c210c986681c39f1dddf8714440
      DYLIBIFY_SHA256: 6d23f6a2fc4d8442f87caa1161aebe6ecaafd0e8c41ce205da007efb04fc82c7
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release | xcpretty && exit ${PIPESTATUS[0]}
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar

      - name: Build pinned SideStore
        shell: bash
        run: |
          set -euo pipefail
          SIDESTORE_DIR="$RUNNER_TEMP/SideStore"
          SIDESTORE_IPA="$RUNNER_TEMP/SideStore.ipa"
          rm -rf "$SIDESTORE_DIR" "$SIDESTORE_IPA"

          git clone "https://github.com/${SIDESTORE_REPOSITORY}.git" "$SIDESTORE_DIR"
          cd "$SIDESTORE_DIR"
          git checkout --detach "$SIDESTORE_COMMIT"
          git submodule update --init --recursive --depth 1

          brew install ldid xcbeautify

          ARTIFACTS_DIR="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$ARTIFACTS_DIR"

          verify_download() {
            local file="$1"
            local expected_sha256="$2"
            local url="$3"

            if [ -f "$file" ] && ! printf '%s  %s\n' "$expected_sha256" "$file" | shasum -a 256 -c - >/dev/null 2>&1; then
              echo "Cached dependency checksum mismatch; removing: $file"
              rm -f "$file"
            fi
            if [ ! -f "$file" ]; then
              curl -fsSL --retry 3 "$url" -o "$file"
            fi
            printf '%s  %s\n' "$expected_sha256" "$file" | shasum -a 256 -c -
          }

          OPENSSL_FILE="$ARTIFACTS_DIR/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          verify_download \
            "$OPENSSL_FILE" \
            "37846a8bd302cb2443eff47f1045ab844d0cd40bf82cc6159cfad9aa5c3eff9e" \
            "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip"

          UNICORN_FILE="$ARTIFACTS_DIR/https___github_com_mahee96_unicorn_releases_download_2_1_4_multiarch_Unicorn_xcframework_zip"
          verify_download \
            "$UNICORN_FILE" \
            "4f61907db6aafc56fb3e336b524d742342312f498bb40739f1da55fb4a24614a" \
            "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/Unicorn.xcframework.zip"

          python3 scripts/ci/verify_zh_hans_localization.py
          python3 scripts/ci/check_zh_hans_ui_coverage.py
          python3 scripts/ci/workflow.py build
          cp SideStore.ipa "$SIDESTORE_IPA"

          unzip -l "$SIDESTORE_IPA" > "$RUNNER_TEMP/sidestore-ipa-files.txt"
          echo '=== SideStore zh-Hans resources ==='
          grep 'Payload/SideStore.app/zh-Hans.lproj/' "$RUNNER_TEMP/sidestore-ipa-files.txt"
          grep -q 'Payload/SideStore.app/zh-Hans.lproj/Localizable.strings' "$RUNNER_TEMP/sidestore-ipa-files.txt"
          grep -q 'Payload/SideStore.app/zh-Hans.lproj/InfoPlist.strings' "$RUNNER_TEMP/sidestore-ipa-files.txt"
          grep -q 'Payload/SideStore.app/zh-Hans.lproj/InterfaceFallback.strings' "$RUNNER_TEMP/sidestore-ipa-files.txt"
          COUNT=$(grep -c 'Payload/SideStore.app/zh-Hans.lproj/' "$RUNNER_TEMP/sidestore-ipa-files.txt")
          if [ "$COUNT" -lt 7 ]; then
            echo "Expected at least 7 SideStore zh-Hans resources, found $COUNT"
            exit 1
          fi

          echo "SIDESTORE_IPA_PATH=$SIDESTORE_IPA" >> "$GITHUB_ENV"
          echo "SIDESTORE_SOURCE_SHA=$SIDESTORE_COMMIT" >> "$GITHUB_ENV"
          echo "SIDESTORE_IPA_SHA256=$(shasum -a 256 "$SIDESTORE_IPA" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Create IPA
        env:
          SIDESTORE_IPA_PATH: ${{ env.SIDESTORE_IPA_PATH }}
          SIDESTORE_IPA_SHA256: ${{ env.SIDESTORE_IPA_SHA256 }}
        run: |
          set -euo pipefail
          echo "Embedding SideStore source commit: $SIDESTORE_SOURCE_SHA"
          sh .github/build_github.sh

      - name: Verify embedded zh-Hans SideStore resources
        shell: bash
        run: |
          set -euo pipefail
          unzip -l "${scheme}+SideStore.ipa" > "$RUNNER_TEMP/livecontainer-sidestore-files.txt"
          PREFIX='Payload/LiveContainer.app/Frameworks/SideStoreApp.framework/zh-Hans.lproj/'
          echo '=== Embedded SideStore zh-Hans resources ==='
          grep "$PREFIX" "$RUNNER_TEMP/livecontainer-sidestore-files.txt"
          grep -q "${PREFIX}Localizable.strings" "$RUNNER_TEMP/livecontainer-sidestore-files.txt"
          grep -q "${PREFIX}InfoPlist.strings" "$RUNNER_TEMP/livecontainer-sidestore-files.txt"
          grep -q "${PREFIX}InterfaceFallback.strings" "$RUNNER_TEMP/livecontainer-sidestore-files.txt"
          COUNT=$(grep -c "$PREFIX" "$RUNNER_TEMP/livecontainer-sidestore-files.txt")
          if [ "$COUNT" -lt 7 ]; then
            echo "Expected at least 7 embedded zh-Hans resources, found $COUNT"
            exit 1
          fi

      - name: Verify final IPA package structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "${scheme}.ipa" >/dev/null
          unzip -t "${scheme}+SideStore.ipa" >/dev/null
          python3 scripts/ci/verify_ipa_package.py --ipa "${scheme}.ipa" --mode standalone
          python3 scripts/ci/verify_ipa_package.py --ipa "${scheme}+SideStore.ipa" --mode combined

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: Get Commit Info
        id: commit_info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.COMMIT_SHA }}
          commit_msg: ${{ env.COMMIT_MSG }}
        run: |
          python .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}
            
            This is a nightly release [created automatically with GitHub Actions workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}).
          files: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact2 }}
            .github/apps_nightly.json
      - name: Update apps.json in Release 1.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          files: |
            LiveContainer.ipa
            LiveContainer+SideStore.ipa
            .github/apps_ss_lc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}