name: Apply LiveProcess Reinstall State Fix

on:
  push:
    branches:
      - fix/liveprocess-reinstall-state-20260908

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[liveprocess-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liveprocess-reinstall-state-20260908
          fetch-depth: 0

      - name: Patch LiveProcess launch state handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('LiveContainerSwiftUI/Utilities/LCUtils.m')
          text = path.read_text()

          implementation = '@implementation LCUtils\n'
          helper = '''@implementation LCUtils\n\nstatic void LCClearPendingGuestLaunchState(void) {\n    NSUserDefaults *defaults = NSUserDefaults.standardUserDefaults;\n    [defaults removeObjectForKey:@"selected"];\n    [defaults removeObjectForKey:@"selectedContainer"];\n    [defaults removeObjectForKey:@"launchAppUrlScheme"];\n}\n'''
          if 'LCClearPendingGuestLaunchState' not in text:
              if implementation not in text:
                  raise SystemExit('LCUtils implementation marker not found')
              text = text.replace(implementation, helper, 1)

          old = '''+ (void)launchMultitaskGuestApp:(NSString *)displayName completionHandler:(void (^)(NSNumber *pid, NSError *error))completionHandler {\n    if(!self.liveProcessBundleIdentifier) {\n        NSError *error = [NSError errorWithDomain:displayName code:2 userInfo:@{NSLocalizedDescriptionKey: @"LiveProcess extension not found. Please reinstall LiveContainer and select Keep Extensions"}];\n        if (completionHandler) completionHandler(nil, error);\n        return;\n    }\n'''
          new = '''+ (void)launchMultitaskGuestApp:(NSString *)displayName completionHandler:(void (^)(NSNumber *pid, NSError *error))completionHandler {\n    [self launchMultitaskGuestApp:displayName remainingLiveProcessRetries:3 completionHandler:completionHandler];\n}\n\n+ (void)launchMultitaskGuestApp:(NSString *)displayName remainingLiveProcessRetries:(NSUInteger)remainingRetries completionHandler:(void (^)(NSNumber *pid, NSError *error))completionHandler {\n    if(!self.liveProcessBundleIdentifier) {\n        if (remainingRetries > 0) {\n            dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(350 * NSEC_PER_MSEC)), dispatch_get_main_queue(), ^{\n                [self launchMultitaskGuestApp:displayName remainingLiveProcessRetries:remainingRetries - 1 completionHandler:completionHandler];\n            });\n            return;\n        }\n\n        // A self-update can leave the old LiveContainer process alive while iOS replaces\n        // the app bundle/extension registration underneath it. Never leave a guest launch\n        // request armed in that stale process, otherwise the next cold launch replays it.\n        LCClearPendingGuestLaunchState();\n        NSError *error = [NSError errorWithDomain:displayName code:2 userInfo:@{NSLocalizedDescriptionKey: @"LiveProcess is not available in the current LiveContainer process. If LiveContainer was just updated, fully close and reopen it. Otherwise reinstall LiveContainer with extensions enabled."}];\n        if (completionHandler) completionHandler(nil, error);\n        return;\n    }\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'remainingLiveProcessRetries' not in text:
              raise SystemExit('launchMultitaskGuestApp block not found')

          path.write_text(text)
          PY

      - name: Verify patch invariants
        run: |
          grep -F 'LCClearPendingGuestLaunchState' LiveContainerSwiftUI/Utilities/LCUtils.m
          grep -F 'remainingLiveProcessRetries:3' LiveContainerSwiftUI/Utilities/LCUtils.m
          grep -F 'removeObjectForKey:@"launchAppUrlScheme"' LiveContainerSwiftUI/Utilities/LCUtils.m
          grep -F 'fully close and reopen it' LiveContainerSwiftUI/Utilities/LCUtils.m

      - name: Commit source fix
        run: |
          if git diff --quiet -- LiveContainerSwiftUI/Utilities/LCUtils.m; then
            echo 'Patch already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LiveContainerSwiftUI/Utilities/LCUtils.m
          git commit -m 'fix: recover cleanly from transient LiveProcess unavailability [liveprocess-fix-applied]'
          git push origin HEAD:fix/liveprocess-reinstall-state-20260908
